<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta http-equiv="refresh" content="1;url=https://jxue.ca" />
    <title>jxue.ca</title>
    <style>
      @font-face {
        font-family: "Geist";
        src: url("https://cdn.jsdelivr.net/npm/geist@1.7.2/dist/fonts/geist-sans/Geist-Variable.woff2")
          format("woff2");
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: #fff;
        color: #111;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0a0a0a;
          color: #ededed;
        }
      }
      main {
        text-align: center;
        padding: 0 1.5rem;
      }
      p {
        font-size: 1.05rem;
        margin: 0;
        opacity: 0.7;
      }
      .dots::after {
        content: "";
        animation: dots 1.4s steps(4, end) infinite;
      }
      @keyframes dots {
        0%,
        20% {
          content: "";
        }
        40% {
          content: ".";
        }
        60% {
          content: "..";
        }
        80%,
        100% {
          content: "...";
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p>Sending you home<span class="dots"></span></p>
    </main>
    <script>
      setTimeout(function () {
        window.location.replace("https://jxue.ca");
      }, 800);
    </script>
  </body>
</html>
